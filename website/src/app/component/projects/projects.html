<section class="bg-white w-100 d-flex px-2 min-vh-100">
  <div class="d-flex flex-column w-100 gap-5" style="margin-top: 96px">

    <div>
      <div class="d-flex flex-row gap-2 px-3 align-items-center " style="margin-bottom: 16px">
        <div class="spacing-border col-md-1"></div>
        <p class="ls-wide m-0 text-ocean ">CASE STUDIES</p>
      </div>

      <div class="d-flex flex-row justify-content-between align-items-end " style="margin-bottom: 64px">
        <h1 class="title-font" style="font-size: 4.5rem">projects</h1>

        <div class="d-flex gap-2 h-25 ">
          <button type="button"
                  class="btn-category main-font fs-6"
                  (click)="$event">
            <!-- [class.active]="selectedCateegory === 'all'" -->
            All
          </button>
          <button type="button"
                  class="btn-category main-font fs-6 "
                  (click)="$event">
            WERB APPS
          </button>
          <button type="button"
                  class="btn-category main-font fs-6"
                  (click)="$event">
            MOBILE
          </button>
          <button type="button"
                  class="btn-category main-font fs-6"
                  (click)="$event">
            ARCHTECTURE
          </button>
        </div>
      </div>
    </div>

    <div class="d-flex flex-row gap-4 justify-content-start align-content-center w-100 overflow-scroll">

      @for (project of projects; track project.id) {
        <div class="card project-card border-0 p-4 shadow-sm col-md-4 ">
          <div class="text-end">
            <i class="bi bi-arrow-up-right fs-4 text-secondary"></i>
          </div>

          <div class="card-body p-0 mb-0">
            <h3 class="card-title title-font bold mb-4">{{ project.title }}</h3>

            <p class="card-text main-font text-secondary mb-5 lh-lg">{{ project.content }}</p>

            <div class="d-flex gap-1 mt-auto position-relative">

              @for (technology of project.technologies; track technology) {
                <div class="d-flex gap-2 z-1">
                  <span class="badge rounded-pill bg-light text-dark border px-3 py-2">{{ technology }}</span>
                </div>
              }
            </div>

            <span class="project-number me-1 ">{{ '0' + project.id }}</span>

          </div>
        </div>
      }

    </div>
  </div>
</section>
